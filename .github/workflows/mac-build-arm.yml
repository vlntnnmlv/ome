name: Mac Build Arm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash ./run.sh
